<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="esmmcqnNy_X_l2O5TzghmwPjkHRAEZXbSSuFcPxeJEA" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" type="image/x-icon" href="{{ "/assets/images/favicon.ico" | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/images/favicon-32x32.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/images/favicon-16x16.png" | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/images/apple-touch-icon.png" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <script type="module" integrity="sha384-H3I/GBuI2vR7qAVY20j3ATk7IbKGz5cjGE6Yu5r32ybgMxbG6WBs1dWh+nVIJzxW" crossorigin="anonymous">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    /* ---------- Theme management (dark is DEFAULT) ---------- */
    const THEME_KEY = 'ezocher-theme';

    function currentTheme() {
      return document.documentElement.getAttribute('data-theme') || 'dark';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
      updateToggleLabel(theme);
      syncGiscus(theme === 'dark' ? 'dark' : 'light');
      renderMermaid();
    }

    function updateToggleLabel(theme) {
      var t = document.getElementById('theme-toggle');
      if (t) t.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }

    /* giscus theme sync (iframe loads async, so retry until ready) */
    function setGiscusTheme(theme) {
      var frame = document.querySelector('iframe.giscus-frame');
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({
          giscus: { setConfig: { theme: theme } }
        }, 'https://giscus.app');
        return true;
      }
      return false;
    }

    function syncGiscus(theme) {
      var attempts = 0;
      var timer = setInterval(function() {
        attempts++;
        var ok = setGiscusTheme(theme);
        if (ok || attempts > 20) clearInterval(timer); // max ~5s
      }, 250);
    }

    /* Mermaid: keep source, re-render with theme */
    function renderMermaid() {
      var theme = currentTheme() === 'dark' ? 'dark' : 'neutral';
      mermaid.initialize({ startOnLoad: false, theme: theme });
      document.querySelectorAll('.mermaid').forEach(function(el) {
        if (!el.dataset.src) el.dataset.src = el.textContent;
        el.textContent = el.dataset.src;
      });
      mermaid.run();
    }

    /* ---------- Init ---------- */
    document.addEventListener('DOMContentLoaded', function() {
      // Default: dark. Respect stored choice if present.
      var stored = null;
      try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
      var theme = stored || 'dark';
      applyTheme(theme);

      // Kramdown renders ```mermaid as <pre><code class="language-mermaid">.
      // Convert to <div class="mermaid"> before first render.
      document.querySelectorAll('pre code.language-mermaid').forEach(function(el) {
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = el.textContent;
        el.parentElement.replaceWith(div);
      });
      renderMermaid();

      // Toggle button
      var toggle = document.getElementById('theme-toggle');
      if (toggle) {
        toggle.addEventListener('click', function() {
          applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
        });
      }
    });
  </script>
  {% include head-custom.html %}
</head>
<body>
  <header class="page-header" role="banner">
    <h1 class="project-name">
      <a href="{{ "/" | relative_url }}" style="color:inherit;text-decoration:none;">{{ site.title }}</a>
    </h1>
    <h2 class="project-tagline">{{ site.description }}</h2>
    <a href="{{ "/tags" | relative_url }}" class="btn">Tags</a>
    <a href="{{ "/suche" | relative_url }}" class="btn">Search</a>
    <a href="{{ "/ueber-mich" | relative_url }}" class="btn">About</a>
    <a href="{{ "/feed.xml" | relative_url }}" class="btn">RSS</a>
    <button id="theme-toggle" class="theme-toggle">☀️ Light</button>
  </header>
  <main id="content" class="main-content" role="main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
